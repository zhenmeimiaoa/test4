plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 读取 local.properties
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

android {
    namespace 'com.example.medicalapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.medicalapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        
        // 从 local.properties 读取密钥生成 BuildConfig
        buildConfigField "String", "ALIYUN_ACCESS_KEY_ID", "\"${localProperties.getProperty('aliyun.accessKeyId', '')}\""
        buildConfigField "String", "ALIYUN_ACCESS_KEY_SECRET", "\"${localProperties.getProperty('aliyun.accessKeySecret', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    implementation "androidx.camera:camera-core:1.3.1"
    implementation "androidx.camera:camera-camera2:1.3.1"
    implementation "androidx.camera:camera-lifecycle:1.3.1"
    implementation "androidx.camera:camera-view:1.3.1"
    
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'
    
    implementation 'com.aliyun:facebody20191230:4.0.9'
    implementation 'com.aliyun:tea-openapi:0.2.12'
    implementation 'com.aliyun:tea-util:0.2.21'
    
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
